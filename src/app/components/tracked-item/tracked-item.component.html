<div class="item-container">
  <div class="item-data">
    <p class="item-name">{{ trackedItem().name }}</p>
    <div class="item-amount-container">
      <p>-</p>
      <p class="item-amount">{{ trackedItem().amount }}</p>
    </div>
  </div>
  <div class="container-buttons">
    <button (click)="decrementTrackedItem.emit(trackedItem())">-</button>
    <button (click)="incrementTrackedItem.emit(trackedItem())">+</button>
    <button (click)="deleteTrackedItem.emit(trackedItem())">x</button>
  </div>
</div>
