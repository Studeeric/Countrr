<div class="item-pill">
  <div class="item-data">
    <p class="">{{ trackedItem().name }}</p>
    <p class="">{{ trackedItem().amount }}</p>
  </div>
  <div class="item-buttons">
    <div class="modifiers">
      <button class="increment" (click)="incrementTrackedItem.emit(trackedItem())">+</button>
      <button class="decrement" (click)="decrementTrackedItem.emit(trackedItem())">-</button>
    </div>
    <button class="delete-button" (click)="deleteTrackedItem.emit(trackedItem())">x</button>
  </div>
</div>
